<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nebula logo">
  <defs>
    <linearGradient id="nb-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe9ff"/>
      <stop offset="1" stop-color="#0a64ff"/>
    </linearGradient>
    <linearGradient id="nb-mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7fdcff"/>
    </linearGradient>
    <filter id="nb-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="#03060d" stroke="url(#nb-ring)" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="32,11 50,21.5 50,42.5 32,53 14,42.5 14,21.5" fill="none" stroke="#0a64ff" stroke-opacity="0.35" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M22 44 V20 L42 44 V20" fill="none" stroke="url(#nb-mark)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#nb-glow)"/>
  <circle cx="46" cy="16" r="2.4" fill="#8fe9ff" filter="url(#nb-glow)"/>
</svg>
