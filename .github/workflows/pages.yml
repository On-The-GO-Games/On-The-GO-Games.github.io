name: Deploy to GitHub Pages

# Manual only for now. The site runs in a Codespace (see .devcontainer).
# Re-add a push trigger here when you want automatic Pages deploys.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Optional: set these as repository variables (Settings > Secrets and variables > Actions > Variables).
      # Pages cannot run the Wisp proxy server, so the proxy needs an external Wisp host.
      - run: pnpm build:pages
        env:
          WISP_URL: ${{ vars.WISP_URL }}
          WISP_PREFERRED: ${{ vars.WISP_PREFERRED }}
          WISP_FALLBACK: ${{ vars.WISP_FALLBACK }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
